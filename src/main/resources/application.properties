spring.application.name=estudiomusical-backend
server.port=9090

# JPA / Hibernate settings
spring.jpa.database=mysql
spring.jpa.show-sql=false
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

# Database connection - MariaDB
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/estudiomusicaldb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JWT: minimo 32 caracteres para HS256
jwt.secret=${JWT_SECRET:estudiomusical-secret-key-2026-segura}
